name: CD (Publication Docker Multi-Tag sur GHCR)

on:
  push:
    branches: [ main ]

jobs:
  publish-cpu:
    name: Build & Push Image CPU (:cpu)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Build et Push mlops-server:cpu
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-rocm:
    name: Build & Push Image AMD ROCm (:rocm & :latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 4. Build et Push mlops-server:rocm et :latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rocm
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:rocm
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
