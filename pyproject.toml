[project]
name = "mlops-server"
version = "0.1.0"
description = "API MLOps d'inférence LLM distribuée (Mac M5 Metal & Linux AMD ROCm)"
readme = "README.md"
authors = [
    { name = "julienfyll", email = "julien.fayolle@centrale.centralelille.fr" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
mlops-server = "mlops_server.main:start"
ai-gateway = "ai_gateway.main:start"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

